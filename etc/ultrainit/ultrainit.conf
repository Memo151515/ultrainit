# UltraInit 1.2 - ana yapilandirma
# Bu dosya root'a ait ve sadece root tarafindan yazilabilir olmalidir
# (chmod 644, chown root:root) - aksi halde ultrainit onu reddeder ve
# varsayilanlari kullanir.

default_runlevel=default

# Ayni anda en fazla kac servis BASLATILIYOR durumunda olabilir (1-64)
max_parallel=16

# Respawn siniri: respawn_window saniye icinde respawn_max'tan fazla coker
# ise servis FAILED olur ve yeniden baslatilmaz.
respawn_window=30
respawn_max=5

# Kapanista servislerin durmasi icin toplam bekleme (sn). Asilirsa kalanlar
# zorla sonlandirilir.
shutdown_timeout=30

# Login acilacak TTY'ler (virgulle ayrilmis). services/getty@.svc sablonundan
# orneklenir. Grafik oturum acici (sddm vb.) tty1'i kullanacaksa buradan
# cikarin (orn. getty_ttys=tty2)
getty_ttys=tty1,tty2

# Merkezi log (ult-journald): tek dosya boyutu (KiB, 64-1048576) ve tutulacak
# dosya sayisi (2-64). Toplam disk ~ boyut x sayi.
#journal_max_file_kb=4096
#journal_max_files=8
