      <rect x="260" y="70" width="470" height="14" fill="#ffffff" opacity="0.9"/>
    </g>
    <text x="270" y="150" font-size="86" fill="none" stroke="#04305f" stroke-opacity="0.3" stroke-width="1" letter-spacing="-1">UltraInit</text>
  </g>

  <rect x="273" y="172" width="150" height="38" rx="19" fill="url(#pillGrad)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5"/>
  <ellipse cx="320" cy="184" rx="55" ry="9" fill="#ffffff" opacity="0.45"/>
  <text x="348" y="197" font-family="'Liberation Sans','Arial',sans-serif" font-weight="700" font-size="18" fill="#0b3d24" text-anchor="middle" letter-spacing="1">v1.2.0</text>

  <text x="273" y="228" font-family="'Liberation Sans','Arial',sans-serif" font-weight="400" font-size="19" fill="#0a4f9e" opacity="0.85">hızlı &#183; güvenli &#183; kaynak koddan derlenebilir init sistemi</text>
</svg>
