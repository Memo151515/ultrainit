  </g>

  <clipPath id="wordClip">
    <text x="270" y="150" font-family="'Liberation Sans','Arial',sans-serif" font-weight="700" font-size="86" letter-spacing="-1">UltraInit</text>
  </clipPath>

  <g font-family="'Liberation Sans','Arial',sans-serif" font-weight="700">
    <text x="272" y="152" font-size="86" fill="#04305f" opacity="0.35" letter-spacing="-1">UltraInit</text>
    <text x="270" y="150" font-size="86" fill="#0a5fb0" letter-spacing="-1">UltraInit</text>
    <g clip-path="url(#wordClip)">
